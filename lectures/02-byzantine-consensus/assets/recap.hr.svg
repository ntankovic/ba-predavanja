<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="340" viewBox="0 0 1040 340"><defs><marker id="arrow-blue" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L18,9 L2,16 Z" fill="#3886ad"/></marker><marker id="arrow-red" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L18,9 L2,16 Z" fill="#b63842"/></marker></defs><rect width="1040" height="340" fill="white"/><rect x="25" y="15" width="990" height="78" rx="12" fill="#f3f8fb"/><rect x="25" y="15" width="7" height="78" fill="#3886ad"/><text x="235" y="62.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#3886ad">Konsenzus</text><text x="700" y="62.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20384d">dogovor + valjanost (sigurnost) i okončanje (živost)</text><rect x="25" y="105" width="990" height="78" rx="12" fill="#f3f8fb"/><rect x="25" y="105" width="7" height="78" fill="#7770a5"/><text x="235" y="152.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#7770a5">Prag</text><text x="700" y="152.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20384d">pad: n ≥ 2f + 1 · bizantski: n ≥ 3f + 1</text><rect x="25" y="195" width="990" height="78" rx="12" fill="#f3f8fb"/><rect x="25" y="195" width="7" height="78" fill="#b38337"/><text x="235" y="242.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#b38337">Članstvo</text><text x="700" y="242.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20384d">f broji neovisne članove, ne identitete</text><text x="520" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20384d">Svaki prag vrijedi samo uz izričit model vremena, kvarova i članstva</text></svg>