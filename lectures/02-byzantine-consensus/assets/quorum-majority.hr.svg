<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="345" viewBox="0 0 1040 345"><defs><marker id="arrow-blue" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L18,9 L2,16 Z" fill="#3886ad"/></marker><marker id="arrow-red" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L18,9 L2,16 Z" fill="#b63842"/></marker></defs><rect width="1040" height="345" fill="white"/><ellipse cx="385" cy="150" rx="185" ry="105" fill="#e7f3fb" stroke="#3886ad" stroke-width="2"/><ellipse cx="655" cy="150" rx="185" ry="105" fill="#fff2df" fill-opacity=".75" stroke="#b38337" stroke-width="2"/><text x="300" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#3886ad">A</text><text x="520" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#28674b">B</text><text x="740" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#b38337">C</text><rect x="115.1" y="263.3" width="40.3" height="27.5" rx="13.8" fill="#fff6ea" stroke="#ebcf9f" stroke-width="1.3"/><text x="265" y="285"  font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#28674b" text-anchor="start"><tspan x="121.1" y="285.0" font-weight="700" fill="#8a5a1c">tx</tspan><tspan x="140.6" y="289.8" font-size="15.8" font-weight="700" fill="#8a5a1c">1</tspan><tspan x="158.4" y="285.0">: A + B → kvorum skupljen</tspan></text><rect x="609.0" y="263.3" width="40.3" height="27.5" rx="13.8" fill="#fff6ea" stroke="#ebcf9f" stroke-width="1.3"/><text x="775" y="285"  font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#b63842" text-anchor="start"><tspan x="615.0" y="285.0" font-weight="700" fill="#8a5a1c">tx</tspan><tspan x="634.5" y="289.8" font-size="15.8" font-weight="700" fill="#8a5a1c">2</tspan><tspan x="652.3" y="285.0">: samo C → kvorum nepotpun</tspan></text><rect x="643.2" y="8.3" width="40.3" height="27.5" rx="13.8" fill="#fff6ea" stroke="#ebcf9f" stroke-width="1.3"/><text x="520" y="30"  font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#28674b" text-anchor="start"><tspan x="353.5" y="30.0">B je pošten: glasa samo za</tspan><tspan x="649.2" y="30.0" font-weight="700" fill="#8a5a1c">tx</tspan><tspan x="668.7" y="34.8" font-size="15.8" font-weight="700" fill="#8a5a1c">1</tspan></text><text x="520" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20384d">Dvije većine od tri dijele člana; pošten član omogućuje samo jednu odluku</text></svg>