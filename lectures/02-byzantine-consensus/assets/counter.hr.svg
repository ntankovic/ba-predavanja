<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400"><defs><marker id="arrow-blue" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L18,9 L2,16 Z" fill="#3886ad"/></marker><marker id="arrow-red" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L18,9 L2,16 Z" fill="#b63842"/></marker></defs><rect width="1040" height="400" fill="white"/><rect x="25" y="15" width="990" height="96" rx="12" fill="#f3f8fb"/><rect x="25" y="15" width="7" height="96" fill="#3886ad"/><text x="195" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#3886ad">„podnosi lažljivca”</text><text x="665" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#20384d">M doda 3 čvora: od 7 glasova drži 3 &gt; f</text><text x="665" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#6b7f8e">Sybil napad</text><rect x="25" y="127" width="990" height="96" rx="12" fill="#f3f8fb"/><rect x="25" y="127" width="7" height="96" fill="#7770a5"/><text x="195" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#7770a5">„konačna kad 3 glasa”</text><text x="665" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#20384d">od 7 čvorova dva skupa od 3 ne moraju se ni preklapati</text><text x="665" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#6b7f8e">kvorum 2f + 1</text><rect x="25" y="239" width="990" height="96" rx="12" fill="#f3f8fb"/><rect x="25" y="239" width="7" height="96" fill="#b38337"/><text x="195" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#b38337">„vođa je pao”</text><rect x="710.6" y="263.3" width="37.8" height="25.0" rx="12.5" fill="#fff6ea" stroke="#ebcf9f" stroke-width="1.3"/><text x="665" y="283"  font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#20384d" text-anchor="start"><tspan x="467.5" y="283.0">vođa samo kasni; ostali su</tspan><tspan x="716.6" y="283.0" font-weight="700" fill="#8a5a1c">tx</tspan><tspan x="734.4" y="287.4" font-size="14.4" font-weight="700" fill="#8a5a1c">1</tspan><tspan x="757.0" y="283.0">već potvrdili</tspan></text><text x="665" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#6b7f8e">„FLP”: spor ili stao?</text><text x="520" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20384d">Popravak: poznato članstvo, kvorum po modelu, istek roka samo za živost</text></svg>