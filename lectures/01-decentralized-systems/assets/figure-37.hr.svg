<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400"><defs><marker id="arrow-blue" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L18,9 L2,16 Z" fill="#3886ad"/></marker><marker id="arrow-red" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L18,9 L2,16 Z" fill="#b63842"/></marker></defs><rect width="1040" height="400" fill="white"/><rect x="25" y="15" width="990" height="96" rx="12" fill="#f3f8fb"/><rect x="25" y="15" width="7" height="96" fill="#3886ad"/><text x="180" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#3886ad">„decentraliziran”</text><text x="665" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20384d">Sva tri poslužitelja vodi isti administrator.</text><text x="665" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#6b7f8e">ranije: Sto poslužitelja, jedan administrator</text><rect x="25" y="127" width="990" height="96" rx="12" fill="#f3f8fb"/><rect x="25" y="127" width="7" height="96" fill="#7770a5"/><text x="180" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#7770a5">„prihvaćena”</text><rect x="557.0" y="150.3" width="39.1" height="26.2" rx="13.1" fill="#fff6ea" stroke="#ebcf9f" stroke-width="1.3"/><rect x="798.2" y="150.3" width="39.1" height="26.2" rx="13.1" fill="#fff6ea" stroke="#ebcf9f" stroke-width="1.3"/><text x="665" y="171"  font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20384d" text-anchor="start"><tspan x="367.1" y="171.0">Poslužitelj 1 potvrdi</tspan><tspan x="563.0" y="171.0" font-weight="700" fill="#8a5a1c">tx</tspan><tspan x="581.7" y="175.6" font-size="15.1" font-weight="700" fill="#8a5a1c">1</tspan><tspan x="599.1" y="171.0">, poslužitelj 2 potvrdi</tspan><tspan x="804.2" y="171.0" font-weight="700" fill="#8a5a1c">tx</tspan><tspan x="823.0" y="175.6" font-size="15.1" font-weight="700" fill="#8a5a1c">2</tspan><tspan x="840.4" y="171.0">: 140 od 100.</tspan></text><text x="665" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#6b7f8e">ranije: Dvije strane ne smiju obećati suprotno</text><rect x="25" y="239" width="990" height="96" rx="12" fill="#f3f8fb"/><rect x="25" y="239" width="7" height="96" fill="#b38337"/><text x="180" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#b38337">„nije prošla”</text><rect x="396.1" y="262.3" width="39.1" height="26.2" rx="13.1" fill="#fff6ea" stroke="#ebcf9f" stroke-width="1.3"/><text x="665" y="283"  font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20384d" text-anchor="start"><tspan x="402.1" y="283.0" font-weight="700" fill="#8a5a1c">tx</tspan><tspan x="420.8" y="287.6" font-size="15.1" font-weight="700" fill="#8a5a1c">1</tspan><tspan x="444.0" y="283.0">je prošao, izgubila se potvrda; novi zahtjev plati opet.</tspan></text><text x="665" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#6b7f8e">ranije: Ponovljeni pokušaj treba isti identitet</text><text font-style="italic" x="520" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#5d7282">Popravak: pravilo prihvaćanja, isti ID pokušaja i izričito tko upravlja.</text></svg>