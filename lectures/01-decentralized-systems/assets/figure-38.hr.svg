<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400"><defs><marker id="arrow-blue" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L18,9 L2,16 Z" fill="#3886ad"/></marker><marker id="arrow-red" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L18,9 L2,16 Z" fill="#b63842"/></marker></defs><rect width="1040" height="400" fill="white"/><rect x="25" y="15" width="990" height="96" rx="12" fill="#f3f8fb"/><rect x="25" y="15" width="7" height="96" fill="#3886ad"/><text x="180" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#3886ad">Replika ≠ ovlast</text><text x="665" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20384d">Kopija podataka ne određuje tko smije mijenjati stanje.</text><text x="665" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#6b7f8e">ranije: Sto poslužitelja, jedan administrator</text><rect x="25" y="127" width="990" height="96" rx="12" fill="#f3f8fb"/><rect x="25" y="127" width="7" height="96" fill="#7770a5"/><text x="180" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#7770a5">Istek roka ≠ neuspjeh</text><text x="665" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20384d">Bez odgovora ishod je nepoznat; ponovni pokušaj nosi isti ID.</text><text x="665" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#6b7f8e">ranije: Zahtjev je izvršen, potvrda nije stigla</text><rect x="25" y="239" width="990" height="96" rx="12" fill="#f3f8fb"/><rect x="25" y="239" width="7" height="96" fill="#b38337"/><text x="180" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#b38337">Poruka ≠ odluka</text><text x="665" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20384d">Odluku sustava određuje pravilo prihvaćanja, ne jedan čvor.</text><text x="665" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#6b7f8e">ranije: „Uzmimo dva od tri” još nije protokol</text><text font-style="italic" x="520" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#5d7282">Jamstvo vrijedi samo uz izričit model: ovlasti, kvarovi i mreža.</text></svg>